<style>
  :root{
    --bg:#FAF8F2;
    --bg2:#F1EDE2;
    --ink:#1E1A14;
    --sheet:#FFFFFF;
    --paper:#F6F1E4;
    --ox:#8C2F26;
    --ox-h:#A8443A;
    --brass:#8F7440;
    --pine:#2C453D;
    --hair:rgba(30,26,20,.16);
    --mut:#6A6354;
    --dark:#1A1712;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--bg);
    background-image:radial-gradient(circle at 25% 20%, rgba(30,26,20,.025) 0 1px, transparent 1.5px),radial-gradient(circle at 75% 70%, rgba(30,26,20,.02) 0 1px, transparent 1.5px);
    color:var(--ink);
    font-family:'Lora',Georgia,serif;font-size:17px;line-height:1.65;
  }
  h1{font-family:'Pirata One',Georgia,serif;font-weight:400;line-height:1.05;}
  h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.05em;line-height:1.05;}
  h3,h4{font-family:'Lora',Georgia,serif;font-weight:600;}
  .mono{font-family:'IBM Plex Mono','Courier New',monospace;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;}
  a{color:inherit;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 20px;}
  :focus-visible{outline:3px solid var(--ox);outline-offset:2px;}
  .skiplink{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--bg);padding:12px 18px;z-index:100;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;}
  .skiplink:focus{left:0;}

  .page{display:none;}
  .page.active{display:block;animation:pageIn .4s ease;}
  @keyframes pageIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion: reduce){
    .page.active{animation:none;}
    *{transition:none!important;animation:none!important;}
  }

  .util{background:var(--dark);color:#B9B1A0;font-size:.8rem;}
  .util .wrap{display:flex;justify-content:space-between;gap:14px;padding:8px 20px;flex-wrap:wrap;}
  .util a{text-decoration:none;transition:color .2s;} .util a:hover{color:#fff;}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#5F8F60;margin-right:7px;animation:pulse 2s infinite;}
  .dot.closed{background:#C2564F;animation:none;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}

  header{position:sticky;top:0;background:var(--bg);border-bottom:2px solid var(--ink);z-index:50;}
  .bar{display:flex;align-items:center;justify-content:space-between;padding:15px 0;gap:16px;}
  .logo{font-family:'Pirata One';font-size:1.7rem;letter-spacing:.02em;color:var(--ink);cursor:pointer;text-decoration:none;}
  .logo span{color:var(--ox);}
  nav.main{display:flex;gap:6px;align-items:center;}
  nav.main a{text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:9px 13px;color:var(--mut);
    background-image:linear-gradient(var(--ox),var(--ox));background-repeat:no-repeat;background-size:0% 2px;background-position:13px calc(100% - 4px);
    transition:color .2s,background-size .25s;}
  nav.main a:hover{color:var(--ink);background-size:calc(100% - 26px) 2px;}
  nav.main a.on{color:var(--ink);background-size:calc(100% - 26px) 2px;}
  .book-btn{background:var(--ox);color:#FAF8F2;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;padding:12px 18px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);white-space:nowrap;transition:background .2s,transform .15s,box-shadow .15s;}
  .book-btn:hover,.book-btn:focus-visible{background:var(--ox-h);transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink);}
  .burger{display:none;background:none;border:2px solid var(--ink);color:var(--ink);padding:9px 13px;font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
  .mobile-nav{display:none;border-top:2px solid var(--ink);background:var(--bg2);}
  .mobile-nav.open{display:block;}
  .mobile-nav a{display:block;padding:14px 20px;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--hair);color:var(--mut);transition:color .2s,background .2s;}
  .mobile-nav a:hover{background:#fff;}
  .mobile-nav a.on{color:var(--ox);}

  section{padding:64px 0;}
  .eyebrow{color:var(--ox);margin-bottom:14px;display:block;}
  h2{font-size:clamp(1.9rem,3.6vw,2.8rem);margin-bottom:26px;color:var(--ink);}

  .sheet{background:var(--sheet);color:var(--ink);border:2px solid var(--ink);outline:1px solid var(--brass);outline-offset:4px;box-shadow:0 10px 26px rgba(30,26,20,.12);}

  .hero{padding:68px 0 58px;display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;}
  .hero h1{font-size:clamp(2.8rem,6vw,4.6rem);color:var(--ink);}
  .hero h1 em{font-style:normal;color:var(--ox);}
  .hero p.lead{margin-top:20px;font-size:1.12rem;max-width:44ch;color:var(--mut);}
  .actions{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap;}
  .btn{display:inline-block;text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;padding:14px 22px;border:2px solid var(--ink);cursor:pointer;background:var(--sheet);color:var(--ink);transition:background .2s,color .2s,transform .15s,box-shadow .15s;}
  .btn:hover,.btn:focus-visible{background:var(--ink);color:var(--bg);}
  .btn.primary{background:var(--ox);color:#FAF8F2;box-shadow:4px 4px 0 var(--ink);}
  .btn.primary:hover,.btn.primary:focus-visible{background:var(--ox-h);color:#fff;transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink);}
  .hero-tags{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap;}
  .tag{border:1.5px solid var(--hair);background:var(--sheet);padding:7px 13px;font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);transition:border-color .2s,color .2s;}
  .tag:hover{border-color:var(--brass);color:var(--ink);}
  .flash-art{position:relative;}
  .flash-art svg{width:100%;height:auto;display:block;filter:drop-shadow(0 12px 26px rgba(30,26,20,.22));}
  .walkin{position:absolute;top:-14px;right:14px;background:var(--brass);color:#FAF8F2;border:2px solid var(--ink);padding:7px 14px;font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;transform:rotate(2deg);z-index:2;}

  .trust{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--bg2);}
  .trust .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:16px 20px;}
  .tb{font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);display:flex;align-items:center;gap:9px;}
  .tb::before{content:"";width:7px;height:7px;background:var(--ox);display:inline-block;transform:rotate(45deg);}

  .stylegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--ink);border:2px solid var(--ink);}
  .style{background:var(--sheet);padding:20px;transition:background .2s;}
  .style:hover{background:var(--paper);}
  .style h3{font-size:.98rem;margin-bottom:6px;color:var(--ink);}
  .style h3::before{content:"\2726";color:var(--ox);margin-right:8px;}
  .style p{font-size:.88rem;color:var(--mut);}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
  .tile{border:2px solid var(--ink);background:var(--sheet);padding:26px;text-decoration:none;transition:transform .2s,box-shadow .2s;}
  .tile:hover{transform:translateY(-3px);box-shadow:0 10px 22px rgba(30,26,20,.14);}
  .tile h3{font-family:'Bebas Neue';font-weight:400;letter-spacing:.05em;font-size:1.4rem;color:var(--ink);margin-bottom:8px;}
  .tile p{font-size:.92rem;color:var(--mut);}
  .tile .go{margin-top:14px;display:inline-block;color:var(--ox);font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;transition:transform .2s;}
  .tile:hover .go{transform:translateX(5px);}

  .artists{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
  .artist{padding:22px;transition:transform .2s,box-shadow .2s;}
  .artist:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(30,26,20,.16);}
  .artist .seat{font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.14em;text-transform:uppercase;color:var(--pine);}
  .artist h3{margin:6px 0 8px;font-size:1.06rem;}
  .artist .styles{font-size:.88rem;font-style:italic;color:var(--mut);}
  .artist .ig{margin-top:12px;display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.66rem;letter-spacing:.08em;border-bottom:1.5px solid var(--ox);text-decoration:none;transition:color .2s;}
  .artist .ig:hover{color:var(--ox);}
  .guest{border:2px dashed var(--hair);background:transparent;color:var(--ink);padding:22px;transition:border-color .2s;}
  .guest:hover{border-color:var(--brass);}
  .guest h3{color:var(--ink);}
  .guest p{color:var(--mut);font-size:.92rem;}
  .ig-note{margin-top:22px;border:2px solid var(--pine);background:#EDF0EA;padding:16px 20px;font-size:.96rem;color:var(--ink);}
  .ig-note b{color:var(--pine);}

  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:22px;}
  .frame{aspect-ratio:1;border:2px solid var(--ink);outline:1px solid var(--brass);outline-offset:3px;background:repeating-linear-gradient(45deg,#EFE9DA 0 10px,#F6F1E4 10px 20px);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px;box-shadow:0 8px 18px rgba(30,26,20,.12);}
  .frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s;}
  .frame:hover img{transform:scale(1.05);}
  .frame span{position:relative;font-family:'IBM Plex Mono',monospace;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;background:var(--sheet);color:var(--ink);border:1px solid var(--ink);padding:3px 8px;transition:background .2s,color .2s;}
  .frame:hover span{background:var(--ox);color:#FAF8F2;border-color:var(--ink);}

  .intake-head{border-bottom:2px solid var(--ink);background:var(--dark);color:#EDE8DB;display:flex;justify-content:space-between;align-items:center;padding:14px 22px;flex-wrap:wrap;gap:8px;}
  .intake-head .mono{color:#C9A96A;}
  .intake-body{padding:28px 24px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  label{display:block;font-family:'IBM Plex Mono',monospace;font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;margin:16px 0 6px;color:var(--mut);}
  input,select,textarea{width:100%;padding:12px;border:2px solid var(--ink);background:var(--bg);font-family:'Lora',Georgia,serif;font-size:1rem;color:var(--ink);transition:background
